[package]
name = "rust_jsi_bridge"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = [
    "staticlib",  # C-compatible static library for iOS/Android
    "lib",        # Rust library for tests and examples
]

[dependencies]
secp256k1 = { version = "0.29", features = ["global-context", "rand-std"] }
bitcoin_hashes = "0.14"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
base64 = "0.22"
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "sync", "macros", "io-util"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"
zeroize = "1"

[dev-dependencies]
rand = "0.8"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros", "io-util", "rt-multi-thread"] }
secp256k1 = "0.29"
hex = "0.4"
