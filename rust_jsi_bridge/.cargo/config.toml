# Convenience build aliases
[alias]
build-ios-device = ["build", "--target", "aarch64-apple-ios", "--release"]
build-ios-sim-arm = ["build", "--target", "aarch64-apple-ios-sim", "--release"]
build-ios-sim-x86 = ["build", "--target", "x86_64-apple-ios", "--release"]
build-android-arm64 = ["build", "--target", "aarch64-linux-android", "--release"]
build-android-armv7 = ["build", "--target", "armv7-linux-androideabi", "--release"]
build-android-x86 = ["build", "--target", "i686-linux-android", "--release"]
build-android-x86_64 = ["build", "--target", "x86_64-linux-android", "--release"]

# iOS linker configuration
[target.aarch64-apple-ios]
rustflags = [
    "-C", "link-arg=-isysroot",
    "-C", "link-arg=$(xcrun --sdk iphoneos --show-sdk-path)",
    "-C", "link-arg=-arch", "-C", "link-arg=arm64",
    "-C", "link-arg=-mios-version-min=13.0"
]

[target.aarch64-apple-ios-sim]
rustflags = [
    "-C", "link-arg=-isysroot",
    "-C", "link-arg=$(xcrun --sdk iphonesimulator --show-sdk-path)",
    "-C", "link-arg=-arch", "-C", "link-arg=arm64",
    "-C", "link-arg=-mios-simulator-version-min=13.0"
]

[target.x86_64-apple-ios]
rustflags = [
    "-C", "link-arg=-isysroot",
    "-C", "link-arg=$(xcrun --sdk iphonesimulator --show-sdk-path)",
    "-C", "link-arg=-arch", "-C", "link-arg=x86_64",
    "-C", "link-arg=-mios-simulator-version-min=13.0"
]

# Android linker configuration
# NDK 28+ uses llvm-ar instead of architecture-specific ar tools
[target.aarch64-linux-android]
linker = "aarch64-linux-android21-clang"
ar = "llvm-ar"

[target.armv7-linux-androideabi]
linker = "armv7a-linux-androideabi21-clang"
ar = "llvm-ar"

[target.i686-linux-android]
linker = "i686-linux-android21-clang"
ar = "llvm-ar"

[target.x86_64-linux-android]
linker = "x86_64-linux-android21-clang"
ar = "llvm-ar"

